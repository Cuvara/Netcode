name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate package.json
        run: |
          node -e "
            const pkg = require('./package.json');
            const required = ['name', 'version', 'displayName', 'description', 'unity'];
            const missing = required.filter(k => !pkg[k]);
            if (missing.length) {
              console.error('Missing fields:', missing.join(', '));
              process.exit(1);
            }
            console.log(pkg.name + '@' + pkg.version + ' — valid');
          "

      - name: Validate CHANGELOG has current version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          grep -q "\[$VERSION\]" CHANGELOG.md || {
            echo "::error::CHANGELOG.md missing entry for v$VERSION"
            exit 1
          }

      - name: Check asmdef names
        run: |
          for f in $(find . -name "*.asmdef" -not -path "./.github/*"); do
            NAME=$(node -p "require('$f').name")
            echo "  $f → $NAME"
          done

  test:
    name: Unity Tests (${{ matrix.unityVersion }})
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      matrix:
        unityVersion:
          - 6000.3.9f1
    steps:
      - uses: actions/checkout@v4

      # Create a minimal Unity project that embeds this package
      - name: Bootstrap test project
        run: |
          mkdir -p TestProject/Packages
          # Link this package into the test project
          echo '{ "dependencies": {} }' > TestProject/Packages/manifest.json
          # Embed package via local reference
          node -e "
            const m = require('./TestProject/Packages/manifest.json');
            m.dependencies['com.cuvara.netcode'] = 'file:../../';
            m.dependencies['com.cysharp.unitask'] = 'https://github.com/Cysharp/UniTask.git?path=src/UniTask/Assets/Plugins/UniTask#2.5.10';
            m.dependencies['com.rpgmmo.shared-gamelogic'] = '$(node -p "require('./package.json').dependencies['com.rpgmmo.shared-gamelogic']")';
            m.testables = ['com.cuvara.netcode'];
            require('fs').writeFileSync('./TestProject/Packages/manifest.json', JSON.stringify(m, null, 2));
          "
          # Minimal ProjectSettings
          mkdir -p TestProject/ProjectSettings
          echo '%YAML 1.1
          %TAG !u! tag:unity3d.com,2011:
          --- !u!129 &1
          PlayerSettings:
            companyName: Cuvara
            productName: NetcodeTest' > TestProject/ProjectSettings/ProjectSettings.asset

      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ matrix.unityVersion }}
          projectPath: TestProject
          testMode: EditMode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode Test Results

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.unityVersion }}
          path: artifacts/
