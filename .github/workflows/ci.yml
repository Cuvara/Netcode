name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    # develop is the integration branch: PRs land here, releases are tagged here,
    # and the consuming client pins those tags. main is kept in the push list so a
    # direct push to it is still built, but nothing targets it by default.
    branches: [develop, main]

permissions:
  contents: read
  checks: write

jobs:
  validate:
    name: Validate package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate package.json
        run: |
          node -e "
            const pkg = JSON.parse(require('fs').readFileSync('./package.json','utf8'));
            const required = ['name', 'version', 'displayName', 'description', 'unity'];
            const missing = required.filter(k => !pkg[k]);
            if (missing.length) {
              console.error('Missing fields:', missing.join(', '));
              process.exit(1);
            }
            console.log(pkg.name + '@' + pkg.version + ' — valid');
          "

      - name: Validate CHANGELOG has current version
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('./package.json','utf8')).version")
          grep -q "\[$VERSION\]" CHANGELOG.md || {
            echo "::error::CHANGELOG.md missing entry for v$VERSION"
            exit 1
          }

      # A missing .meta does not fail a build here and does not show in these test
      # results -- it fails a CONSUMER'S suite, because Unity logs an Error and the
      # test framework turns unexpected log errors into exceptions. v0.14.0 and
      # v0.15.0 shipped HeldMovementParityTests.cs without one: the test never ran
      # anywhere, and downstream saw a red run with zero failing tests.
      - name: Every Unity-visible file has a .meta
        run: python3 .github/scripts/check_metas.py

      - name: Check asmdef names
        run: |
          find . -name "*.asmdef" -not -path "./.github/*" | while read f; do
            NAME=$(node -p "JSON.parse(require('fs').readFileSync('$f','utf8')).name")
            echo "  $f → $NAME"
          done

  # ---------------------------------------------------------------------------
  # Compile the samples.
  #
  # Samples~/ is excluded from Unity's import by design, so NOTHING else in this
  # workflow compiles a line of it — 206 tests pass around files that are read and
  # never built. That gap shipped a DOTS sample calling the legacy UnityEngine.Input
  # API in a project configured for the Input System package, where it throws every
  # frame out of Update() and takes the whole bridge down with it: no connection, no
  # spawn, nothing. It reached a user as "nothing works".
  #
  # This job gives the samples a compiler. It does not run them, so it would not have
  # caught that specific throw — but it is the structural hole that let sample code
  # ship unexamined, and it catches every compile-time break from here on.
  # ---------------------------------------------------------------------------
  samples:
    name: Compile samples (${{ matrix.unityVersion }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        unityVersion:
          - 6000.3.9f1
    steps:
      - uses: actions/checkout@v4
        with:
          path: package

      - name: Bootstrap a project with the samples imported
        run: |
          mkdir -p Assets ProjectSettings Packages

          # Samples~ is invisible to Unity where it sits; importing a sample means
          # copying it under Assets/, which is exactly what the Package Manager does.
          #
          # Copy every sample package.json DECLARES rather than naming one here. The
          # hardcoded list was already four samples stale: DemoBootstrap, WorldView,
          # E2ECertification and ContentPipeline were all shipping with nothing
          # compiling them, while this job reported success over samples it had never
          # seen. A list maintained by hand goes stale silently — that is the failure
          # mode issue #30 is about, and naming one sample here reproduces it one
          # sample at a time.
          mkdir -p "Assets/Samples"
          for rel in $(python3 -c "import json;[print(e['path']) for e in json.load(open('package/package.json')).get('samples',[])]"); do
            cp -r "package/${rel}" "Assets/Samples/${rel##*/}"
          done
          echo "samples imported: $(ls Assets/Samples | tr '\n' ' ')"

          # com.unity.modules.imageconversion is here for WorldView: its screenshot
          # helper calls Texture2D.EncodeToPNG, an extension method that lives in that
          # module. A real Unity project has it by default; this hand-written manifest
          # does not, so the sample compiled everywhere except in this job. The gap only
          # became visible once the job stopped compiling one sample and compiled all five.
          #
          # Note this block is JSON, not YAML — a '#' comment inside the heredoc below
          # makes the manifest unparseable and Unity rejects the whole project.
          cat > Packages/manifest.json << 'JSON'
          {
            "dependencies": {
              "com.cuvara.netcode": "file:../package",
              "com.cysharp.unitask": "2.5.10",
              "jp.hadashikick.vcontainer": "1.16.8",
              "com.rpgmmo.shared-gamelogic": "https://github.com/Cuvara/rpg-mmo-server.git?path=/backend/gameserver-dotnet/Shared.GameLogic#sgl-v0.3.0",
              "com.unity.entities": "1.4.8",
              "com.unity.entities.graphics": "1.4.21",
              "com.unity.burst": "1.8.30",
              "com.unity.collections": "2.6.8",
              "com.unity.mathematics": "1.3.2",
              "com.unity.inputsystem": "1.18.0",
              "com.unity.render-pipelines.universal": "17.3.0",
              "com.unity.modules.imageconversion": "1.0.0"
            },
            "scopedRegistries": [
              {
                "name": "OpenUPM",
                "url": "https://package.openupm.com",
                "scopes": ["com.cysharp", "jp.hadashikick"]
              }
            ]
          }
          JSON

          cat > ProjectSettings/ProjectVersion.txt << 'TXT'
          m_EditorVersion: ${{ matrix.unityVersion }}
          TXT

          # activeInputHandler: 1 = Input System package ONLY. Deliberately the strictest
          # setting: it is where the legacy API throws, and it is what a Unity 6 project
          # is most likely to be on. A sample that only compiles under "Both" is a sample
          # that breaks for most consumers.
          cat > ProjectSettings/ProjectSettings.asset << 'YAML'
          %YAML 1.1
          %TAG !u! tag:unity3d.com,2011:
          --- !u!129 &1
          PlayerSettings:
            companyName: Cuvara
            productName: NetcodeSampleCompile
            activeInputHandler: 1
          YAML

      - name: Compile
        id: compile
        continue-on-error: true
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ matrix.unityVersion }}
          testMode: EditMode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Sample compile results

      - name: Samples must compile
        run: |
          if [ "${{ steps.compile.outcome }}" != "success" ]; then
            echo "::error::The samples did not compile. Samples~/ is not built by any" \
                 "other job, so this is the only thing standing between a broken sample" \
                 "and a consumer importing it."
            for d in artifacts Logs; do
              [ -d "$d" ] && grep -rhoE "error CS[0-9]+: [^\"]{0,160}" "$d" 2>/dev/null | sort -u | head -20
            done
            exit 1
          fi
          echo "samples compiled"

  test:
    name: Unity Tests (${{ matrix.unityVersion }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        unityVersion:
          - 6000.3.9f1
    steps:
      - uses: actions/checkout@v4
        with:
          path: package

      # Build a Unity project at repo root that references the package
      - name: Bootstrap test project
        run: |
          mkdir -p Assets ProjectSettings Packages

          cat > Packages/manifest.json << 'JSON'
          {
            "dependencies": {
              "com.cuvara.netcode": "file:../package",
              "com.cysharp.unitask": "2.5.10",
              "jp.hadashikick.vcontainer": "1.16.8",
              "com.rpgmmo.shared-gamelogic": "https://github.com/Cuvara/rpg-mmo-server.git?path=/backend/gameserver-dotnet/Shared.GameLogic#sgl-v0.3.0"
            },
            "scopedRegistries": [
              {
                "name": "OpenUPM",
                "url": "https://package.openupm.com",
                "scopes": ["com.cysharp", "jp.hadashikick"]
              }
            ],
            "testables": ["com.cuvara.netcode"]
          }
          JSON

          cat > ProjectSettings/ProjectSettings.asset << 'YAML'
          %YAML 1.1
          %TAG !u! tag:unity3d.com,2011:
          --- !u!129 &1
          PlayerSettings:
            companyName: Cuvara
            productName: NetcodeTest
          YAML

      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ matrix.unityVersion }}
          testMode: EditMode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode Test Results

      # The runner is started with USE_EXIT_CODE=false, so Unity exiting 0 says only
      # that Unity started and stopped. It exits 0 on "No tests were executed" too, and
      # the published check goes NEUTRAL rather than red — which is how this repo ran
      # green for its entire history while executing zero tests. This step is the gate:
      # it reads what the runner actually produced and fails on an empty or failing run.
      - name: Assert tests ran and passed
        if: always()
        run: |
          python3 - << 'PY'
          import glob, sys, xml.etree.ElementTree as ET

          files = sorted(glob.glob('artifacts/**/*.xml', recursive=True))
          if not files:
              sys.exit('::error::No test result XML was produced. '
                       'The runner reported nothing, so nothing was verified.')

          total = passed = failed = errors = inconclusive = skipped = 0
          for path in files:
              try:
                  run = ET.parse(path).getroot()
              except ET.ParseError as exc:
                  sys.exit(f'::error::{path} is not parseable XML: {exc}')
              if run.tag != 'test-run':
                  continue
              g = lambda k: int(run.get(k) or 0)
              total += g('total'); passed += g('passed'); failed += g('failed')
              errors += g('errors'); inconclusive += g('inconclusive'); skipped += g('skipped')

          print(f'total={total} passed={passed} failed={failed} '
                f'errors={errors} inconclusive={inconclusive} skipped={skipped}')

          if total == 0:
              sys.exit('::error::Zero tests were executed. A green run that ran nothing '
                       'is not a passing run — check that the package resolves and that '
                       'its test assembly loads (a plugin that fails reference validation '
                       'takes the whole assembly chain down silently).')
          if failed or errors:
              sys.exit(f'::error::{failed} failed and {errors} errored out of {total}.')
          print(f'::notice::{passed}/{total} EditMode tests passed.')
          PY

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.unityVersion }}
          path: artifacts/

  # Does the package install on its own declarations alone?
  #
  # The 'test' job above hand-writes UniTask, VContainer, Shared.GameLogic AND the OpenUPM
  # scopedRegistries block into the manifest it bootstraps — so it supplies every single
  # thing whose absence is in question, and can never answer this. That accident is what
  # hid three install defects. This job removes the hand-supply, one variable at a time.
  #
  # It does not run tests. It asks only whether Unity can resolve and compile the package,
  # and it reports what happened either way — 'continue-on-error' because the point is the
  # evidence, not a pass/fail gate, until we know what the answer even is.
  install-probe:
    name: Install probe (${{ matrix.probe.name }})
    runs-on: ubuntu-latest
    # Only the informational rows are allowed to fail. Leaving this 'true' for every row
    # would let the documented-install row go red without failing anything — a gate that
    # cannot fail, which is the exact defect this whole job exists because of.
    continue-on-error: ${{ !matrix.probe.required }}
    strategy:
      fail-fast: false
      matrix:
        probe:
          # Nothing but the package. Its own 'dependencies' are the only thing that can
          # satisfy it, and no scoped registry exists to resolve OpenUPM-hosted entries.
          - name: bare
            registries: false
            handDeps: false
          # The package plus the OpenUPM scoped registry, still with no hand-written
          # dependencies. This is the realistic consumer: they added the registry the
          # README tells them to, and nothing else.
          - name: openupm-registry-only
            registries: true
            handDeps: false
          # The package plus exactly what the README tells a consumer to add: the OpenUPM
          # scoped registry and the Shared.GameLogic git entry. Nothing else. This is the
          # documented install, so this row is the one that must pass.
          - name: documented-prereqs
            registries: true
            handDeps: false
            sharedGameLogic: true
            required: true
          # The documented install with VContainer deliberately withheld. VContainer is
          # optional as of 0.6.0: Cuvara.Netcode.DI and Cuvara.Netcode.Bootstrap are gated
          # behind a versionDefines symbol, so a consumer without it should lose those two
          # assemblies and keep a working transport. This row is what makes that claim
          # falsifiable — if the gating is wrong, the package stops compiling here.
          - name: no-vcontainer
            registries: true
            handDeps: false
            sharedGameLogic: true
            blockVContainer: true
            required: true
    steps:
      - uses: actions/checkout@v4
        with:
          path: package

      - name: Bootstrap probe project
        run: |
          mkdir -p Assets ProjectSettings Packages

          REGISTRIES=""
          if [ "${{ matrix.probe.registries }}" = "true" ]; then
            SCOPES='"com.cysharp","jp.hadashikick","org.nuget"'
            # Withhold the VContainer scope entirely, so nothing can pull it in as a
            # transitive dependency and quietly satisfy what we are testing the absence of.
            if [ "${{ matrix.probe.blockVContainer }}" = "true" ]; then
              SCOPES='"com.cysharp","org.nuget"'
            fi
            REGISTRIES="\"scopedRegistries\": [{\"name\":\"OpenUPM\",\"url\":\"https://package.openupm.com\",\"scopes\":[$SCOPES]}],"
          fi

          SGL=""
          if [ "${{ matrix.probe.sharedGameLogic }}" = "true" ]; then
            SGL='"com.rpgmmo.shared-gamelogic": "https://github.com/Cuvara/rpg-mmo-server.git?path=/backend/gameserver-dotnet/Shared.GameLogic#sgl-v0.3.0",'
          fi

          cat > Packages/manifest.json << JSON
          {
            "dependencies": {
              $SGL
              "com.cuvara.netcode": "file:../package"
            },
            $REGISTRIES
            "testables": ["com.cuvara.netcode"]
          }
          JSON

          echo "--- manifest under test ---"
          cat Packages/manifest.json

          cat > ProjectSettings/ProjectSettings.asset << 'YML'
          %YAML 1.1
          %TAG !u! tag:unity3d.com,2011:
          --- !u!129 &1
          PlayerSettings:
            companyName: Cuvara
            productName: NetcodeInstallProbe
          YML

      - name: Compile
        id: compile
        continue-on-error: true
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ matrix.unityVersion || '6000.3.9f1' }}
          testMode: EditMode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Install probe ${{ matrix.probe.name }}

      # Only the documented-install row gates. The other two exist to record what a
      # consumer sees when a prerequisite is missing, and both are expected to fail —
      # gating them would mean asserting the package installs with no registry at all,
      # which it has never claimed to do.
      - name: Required row must compile
        if: matrix.probe.required && steps.compile.outcome != 'success'
        run: |
          echo "::error::The documented install failed. A consumer following the README" \
               "cannot compile this package."
          exit 1

      - name: Report what Unity said
        if: always()
        run: |
          echo "### Install probe: ${{ matrix.probe.name }}" >> $GITHUB_STEP_SUMMARY
          echo "compile step outcome: ${{ steps.compile.outcome }}" >> $GITHUB_STEP_SUMMARY
          LOG=$(find . -name '*.log' -path '*artifacts*' 2>/dev/null | head -1)
          for f in $(find . -name 'editmode-results.xml' -o -name '*.log' 2>/dev/null | head -5); do
            echo "--- $f"
          done
          # Surface the two failure shapes we are distinguishing between.
          #
          # Scan ONLY what Unity produced. Scanning '.' also reads the checked-out package,
          # whose CHANGELOG quotes these exact error strings verbatim — which reported two
          # CS0246s from a run that compiled cleanly. A diagnostic that matches its own
          # documentation is worse than none.
          SCAN=""
          for d in artifacts Logs Library/Bee; do [ -d "$d" ] && SCAN="$SCAN $d"; done
          if [ -z "$SCAN" ]; then
            echo "no Unity output directories to scan" | tee -a $GITHUB_STEP_SUMMARY
          else
            grep -rhoE "Package \[[^]]+\] cannot be found" $SCAN 2>/dev/null | sort -u | tee -a $GITHUB_STEP_SUMMARY || true
            grep -rhoE "error CS[0-9]+: [^\"]{0,120}" $SCAN 2>/dev/null | sort -u | head -20 | tee -a $GITHUB_STEP_SUMMARY || true
            grep -rhA3 "An error occurred while resolving packages:" $SCAN 2>/dev/null | head -20 | tee -a $GITHUB_STEP_SUMMARY || true
          fi

  wire:
    name: Generated Wire.cs matches the backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Diffs against the backend's COMMITTED generated file rather than running protoc
      # here. Both repos generate from the same wire.proto with the same generator, so the
      # two files are byte-identical by construction — this repo's copy and
      # rpg-mmo-server's GameServer/Net/Generated/.../Wire.cs had md5 c77092611a6e7815 on
      # both sides when this job was written.
      #
      # Regenerating instead would mean pinning protoc AND the C# plugin to the exact
      # versions the backend used, because generated output moves between generator
      # versions. That produces diffs which are not drift, and a gate that cries wolf gets
      # switched off. Comparing the artefacts asks the question that actually matters: do
      # the two sides decode the same wire?
      - name: Fetch the backend's generated Wire.cs
        env:
          # develop is the backend's integration branch. Deliberately not a pinned ref: a
          # schema change landing there SHOULD turn this red until this package regenerates.
          # That is the drift the gate exists to catch, and pinning would hide it until
          # someone remembered to move the pin — which is the failure mode of the stale
          # copy itself.
          UPSTREAM: https://raw.githubusercontent.com/Cuvara/rpg-mmo-server/develop/backend/gameserver-dotnet/GameServer/Net/Generated/RpgMmo/Wire/V1/Wire.cs
        run: |
          set -euo pipefail
          curl -fsSL "${UPSTREAM}" -o /tmp/upstream-Wire.cs
          echo "fetched $(wc -c < /tmp/upstream-Wire.cs) bytes"

      - name: Compare
        run: |
          set -uo pipefail
          MINE="Runtime/Protocol/Generated/Wire.cs"

          if cmp -s "${MINE}" /tmp/upstream-Wire.cs; then
            echo "::notice title=Wire.cs in sync::$(md5sum "${MINE}" | cut -d' ' -f1)"
            {
              echo "### Generated Wire.cs is in sync"
              echo ""
              echo "Byte-identical to the backend's copy."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # A stale copy DECODES CLEANLY: a field added to the schema since generation
          # reads as its type default, with no exception and no failed test. Saying what
          # differs is the whole value here — "they differ" would leave the reader to
          # rediscover it.
          {
            echo "### Generated Wire.cs has drifted from the backend"
            echo ""
            echo "\`Runtime/Protocol/Generated/Wire.cs\` is not byte-identical to"
            echo "\`rpg-mmo-server\`'s generated copy on \`develop\`."
            echo ""
            echo "A stale copy does not fail loudly. It decodes cleanly and reads any field"
            echo "added since generation as that type's default — zero for a number, empty for"
            echo "a string — so the symptom is a feature that looks wired up and silently does"
            echo "nothing, with every test on both sides still passing."
            echo ""
            echo '```diff'
            diff -u "${MINE}" /tmp/upstream-Wire.cs | head -60 || true
            echo '```'
            echo ""
            echo "Fix: regenerate, or copy the backend's file over this one. Note protoc nests"
            echo "output under the csharp_namespace, so a bare --csharp_out writes"
            echo "\`Generated/RpgMmo/Wire/V1/Wire.cs\` and leaves the committed"
            echo "\`Generated/Wire.cs\` untouched while reporting success."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error::Generated Wire.cs differs from the backend's copy — see the job summary."
          exit 1
