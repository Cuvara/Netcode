name: Version Bump

on:
  workflow_dispatch:
    inputs:
      bump-type:
        description: 'Semver bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      new-version: ${{ steps.bump.outputs.new-version }}
      previous-version: ${{ steps.bump.outputs.previous-version }}
    steps:
      - name: Generate bot token
        id: bot-token
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -z "${APP_ID}" ] || [ -z "${APP_PRIVATE_KEY}" ]; then
            echo "APP_ID or APP_PRIVATE_KEY not set — falling back to GITHUB_TOKEN"
            echo "token=${{ secrets.GITHUB_TOKEN }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BOT_TOKEN=$(node -e "
            const crypto = require('crypto');
            const now = Math.floor(Date.now() / 1000);
            const payload = JSON.stringify({ iat: now - 60, exp: now + 540, iss: '${APP_ID}' });
            const header = JSON.stringify({ alg: 'RS256', typ: 'JWT' });
            const b64 = (s) => Buffer.from(s).toString('base64url');
            const sign = crypto.createSign('RSA-SHA256');
            sign.update(b64(header) + '.' + b64(payload));
            const sig = sign.sign(Buffer.from('${APP_PRIVATE_KEY}'.replace(/\\\\n/g, '\n'), 'utf8'), 'base64url');
            const jwt = b64(header) + '.' + b64(payload) + '.' + sig;
            const https = require('https');
            const req = https.request({
              hostname: 'api.github.com', path: '/app/installations',
              method: 'GET', headers: { Authorization: 'Bearer ' + jwt, Accept: 'application/vnd.github+json', 'User-Agent': 'cuvara-bot' }
            }, (res) => {
              let d = ''; res.on('data', c => d += c); res.on('end', () => {
                const instId = JSON.parse(d).find(i => i.account.login === '${{ github.repository_owner }}').id;
                const req2 = https.request({
                  hostname: 'api.github.com', path: '/app/installations/' + instId + '/access_tokens',
                  method: 'POST', headers: { Authorization: 'Bearer ' + jwt, Accept: 'application/vnd.github+json', 'User-Agent': 'cuvara-bot' }
                }, (res2) => { let d2 = ''; res2.on('data', c => d2 += c); res2.on('end', () => console.log(JSON.parse(d2).token)); });
                req2.end();
              });
            }); req.end();
          ")
          if [ -z "${BOT_TOKEN}" ]; then
            echo "::error::Failed to generate bot token"
            exit 1
          fi
          echo "::add-mask::${BOT_TOKEN}"
          echo "token=${BOT_TOKEN}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.bot-token.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump version
        id: bump
        run: |
          PREV=$(node -p "require('./package.json').version")
          npm version ${{ inputs.bump-type }} --no-git-tag-version
          NEW=$(node -p "require('./package.json').version")
          echo "previous-version=${PREV}" >> "$GITHUB_OUTPUT"
          echo "new-version=${NEW}" >> "$GITHUB_OUTPUT"
          echo "Bumped ${PREV} → ${NEW}"

      - name: Update CHANGELOG
        run: |
          NEW=${{ steps.bump.outputs.new-version }}
          DATE=$(date +%Y-%m-%d)
          sed -i "s/^## \[Unreleased\]/## [Unreleased]\n\n## [${NEW}] - ${DATE}/" CHANGELOG.md
          echo "CHANGELOG tagged [${NEW}] - ${DATE}"

      - name: Commit and push
        run: |
          git config user.name "Cuvara-BOT[bot]"
          git config user.email "cuvara-bot[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md
          git commit -m "chore: bump to v${{ steps.bump.outputs.new-version }}"
          git push
